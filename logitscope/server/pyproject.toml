[project]
name = "logitscope"
version = "0.1.0"
description = "an oscilloscope for transformers"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51,<5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "huggingface-hub>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs real model weights on disk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logitscope"]
